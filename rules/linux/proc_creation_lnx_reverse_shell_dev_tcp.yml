title: Bash Reverse Shell via /dev/tcp
id: e6e321b4-c4d0-4e4b-8f05-f7f66ca38356
status: experimental
description: >
  Detects an interactive shell wired to a network socket through bash's /dev/tcp pseudo-device, the classic one-line reverse shell.
references:
  - https://attack.mitre.org/techniques/T1059/004/
author: mani17S
date: 2026-11-24
tags:
  - attack.execution
  - attack.t1059.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_dev:
    CommandLine|contains: '/dev/tcp/'
  selection_shell:
    CommandLine|contains:
      - 'bash -i'
      - 'sh -i'
      - '>&'
      - '0>&1'
  condition: selection_dev and selection_shell
falsepositives:
  - Rare admin one-liners that redirect to /dev/tcp for port checks (those rarely include an interactive flag or fd duplication)
level: high
