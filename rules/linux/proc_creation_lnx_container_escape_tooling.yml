title: Container Escape Indicators (Privileged Run, Root Mount, nsenter PID 1)
id: 264c3dae-6d84-4a9e-a2a6-2aee3ded6cc8
status: experimental
description: >
  Detects commands commonly used to break out of or bypass container isolation: running a privileged container, bind-mounting the host root filesystem, or entering PID 1's namespaces with nsenter.
references:
  - https://attack.mitre.org/techniques/T1611/
author: mani17S
date: 2026-11-24
tags:
  - attack.privilege_escalation
  - attack.t1611
logsource:
  category: process_creation
  product: linux
detection:
  selection_privileged:
    Image|endswith: '/docker'
    CommandLine|contains: ' --privileged'
  selection_rootmount:
    Image|endswith: '/docker'
    CommandLine|contains:
      - ' -v /:/'
      - ' --volume /:/'
      - ' --volume=/:/'
  selection_nsenter:
    Image|endswith: '/nsenter'
    CommandLine|contains:
      - ' --target 1 '
      - ' -t 1 '
  condition: 1 of selection_*
falsepositives:
  - Legitimate privileged containers (CNI/CSI agents, monitoring DaemonSets); allow-list by image and host
level: high
