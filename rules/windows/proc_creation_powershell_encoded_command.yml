title: PowerShell Encoded Command Execution
id: 3936309e-787c-48da-908a-c102dbdb4b38
status: experimental
description: >
  Detects PowerShell launched with an encoded command argument. Attackers use -EncodedCommand to
  hide script content from simple command-line inspection.
references:
  - https://attack.mitre.org/techniques/T1027/010/
  - https://attack.mitre.org/techniques/T1059/001/
author: mani17S
date: 2026-11-24
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    CommandLine|windash|contains:
      - ' -enc '
      - ' -enco'
      - ' -encodedcommand '
      - ' -ec '
  condition: selection_img and selection_flag
falsepositives:
  - Software deployment and management tools that pass encoded scripts (tune by ParentImage or signer)
level: medium
