title: Office Application Spawning Script or Shell Interpreter
id: 72fda915-f652-4de1-85ed-1393b0f7902c
status: experimental
description: >
  Detects a Microsoft Office application starting a command shell or script host. This is a common
  result of a malicious macro or document exploit.
references:
  - https://attack.mitre.org/techniques/T1204/002/
  - https://attack.mitre.org/techniques/T1059/
author: mani17S
date: 2026-11-24
tags:
  - attack.execution
  - attack.t1204.002
  - attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate macro-enabled business workflows (baseline by document path or user group)
level: high
