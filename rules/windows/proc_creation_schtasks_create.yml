title: Scheduled Task Created via schtasks
id: aa6b8e60-bcd3-4a54-a9ca-b598b4cbc7be
status: experimental
description: >
  Detects creation of a scheduled task with schtasks.exe. Adversaries use scheduled tasks for
  persistence and delayed or repeated execution.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: mani17S
date: 2026-11-24
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: ' /create '
  condition: selection
falsepositives:
  - Software installers and administrators creating legitimate tasks (expect noise; use for hunting or tune per environment)
level: medium
