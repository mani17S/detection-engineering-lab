title: LSASS Memory Dump via comsvcs or ProcDump
id: 8e5f25cb-f1c8-476b-8075-2255c89798c9
status: experimental
description: >
  Detects common command lines used to dump LSASS process memory for credential theft: rundll32
  calling comsvcs.dll MiniDump (by name or by its ordinal, #24), or ProcDump/PPLdump targeting lsass.
  Command-line matching is evadable; pair it with the process-access rule that keys on behaviour.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: mani17S
date: 2026-11-24
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_comsvcs_dll:
    CommandLine|contains: 'comsvcs'
  selection_comsvcs_fn:
    CommandLine|contains:
      - 'minidump'
      - '#24 '
      - '#+000024'
  selection_procdump:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
      - '\ppldump.exe'
    CommandLine|contains: 'lsass'
  condition: (selection_comsvcs_dll and selection_comsvcs_fn) or selection_procdump
falsepositives:
  - Authorised incident-response or debugging activity (should be pre-announced and allow-listed by host)
level: high
