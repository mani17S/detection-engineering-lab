title: Volume Shadow Copy Deletion
id: 3aec69dc-23d7-4ea3-ad12-08a4558007a2
status: experimental
description: >
  Detects deletion of Volume Shadow Copies through vssadmin or wmic, a step commonly taken by
  ransomware to prevent recovery.
references:
  - https://attack.mitre.org/techniques/T1490/
author: mani17S
date: 2026-11-24
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  condition: 1 of selection_*
falsepositives:
  - Backup or storage-maintenance software that prunes shadow copies
level: high
