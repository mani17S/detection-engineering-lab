title: Certutil Used to Encode or Decode a File
id: 48a9f465-1f44-4a0c-9ce6-81bb1793f0b1
status: experimental
description: >
  Detects certutil encoding or decoding a file. Adversaries use certutil to turn a base64 or hex
  text file back into an executable or DLL (and the reverse) to move payloads past content filters.
references:
  - https://attack.mitre.org/techniques/T1140/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: mani17S
date: 2026-11-24
tags:
  - attack.defense_evasion
  - attack.t1140
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\certutil.exe'
  selection_action:
    CommandLine|windash|contains:
      - ' -decode '
      - ' -encode '
      - ' -decodehex '
      - ' -encodehex '
  condition: selection_img and selection_action
falsepositives:
  - Administrators converting certificates between PEM/DER and base64 formats (check the file extension and path)
level: medium
